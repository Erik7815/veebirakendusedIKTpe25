    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
    <script
            src="https://code.jquery.com/ui/1.14.1/jquery-ui.min.js"
            integrity="sha256-AlTido85uXPlSyyaZNsjJXeCs07eSv3r43kyCVc8ChI="
            crossorigin="anonymous"></script>
    <script type="text/javascript">
        $(function() {
            $('.vihjemull').mouseover(function(e) {
                var mull = $(this).attr('title')
                $(this).attr('title', '');
                $(this).append('<div id="vihje">' + mull + '</div>');
                $('#vihje').fadeIn('500');
                $('#vihje').fadeTo('10', 0.9);
            }).mousemove(function(e) {
                    $('#vihje').css('top', e.pageY + 10 );
                    $('#vihje').css('left', e.pageX + 20 );
            } ).mouseout(function() {
                $(this).attr('title',$('#vihje').html());
                $(this).children('div#vihje').remove();
            });
        });
    </script>
</head>
