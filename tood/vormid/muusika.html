<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika</title>
  <script src="../js/muusikaScript.js"></script>
</head>
<body>
<h1>Muusika küsitlus</h1>
<table border="1">
<tr>
  <td>
    <strong>Milliseid muusikuid/ansambleid sa tead?</strong>

  </td>
  <td>
    <fieldset>

    <input type="checkbox" id="muusik1" name="muusik" value="muusik1" onchange="muusikuvalik()">
    <label for="muusik1">Male</label>
      <br>
      <input type="checkbox" id="muusik2" name="muusik" value="muusik2" onchange="muusikuvalik()">
      <label for="muusik2">Female</label>
      <br>
      <input type="checkbox" id="muusik3" name="muusik" value="muusik3" onchange="muusikuvalik()">
      <label for="muusik3">Male</label>

    </fieldset>
  </td>
  <td>
    <div id="vastus1"></div>
  </td>
</tr>
  <tr>
    <td>
      <label for="arvamus">Mida arvad muusika kuulamisest koolis?</label>
    </td>
    <td>
      <input type="text" id="arvamus" oninput="muusikaarvvamus()">
    </td>
    <td>
      <div id="vastus2"></div>
    </td>
  </tr>
  <tr>
    <td>
      <label for="tund">Mitu tundi päevas sa kuulad muusikat?</label>

    </td>
    <td>
      <input type="number" min="0" max="24" step="1" value="6" id="tund" oninput="muusikanumber()">
    </td>
    <td>
      <div id="vastus3"></div>
    </td>
  </tr>
  <tr>
    <td>
      <strong>Kas sa kuulad raadiot? </strong>
    </td>
    <td>

      <br>
      <input type="radio" name="jah" value="jah" id="jah" onclick="radiokuulamine()">
      <label for="Jah">Jah</label>
      <br>
      <input type="radio" name="jah" value="ei" id="ei" onclick="radiokuulamine()">
      <label for="ei">Ei</label>
    </td>
    <td>
      <div id="vastus4"></div>
    </td>
  </tr>
  <tr>
    <td>
      <strong>Milliseid raadiojaamu oskad nimetada?</strong>
      </td>
    <td>
      <input type="text" id="jaam" oninput="raadio()">
    </td>
    <td>
      <div id="vastus5"></div>
    </td>
  </tr>
  <tr>
    <td>
      <strong>Millist muusikat sa kõige rohkem kuulad?</strong>
    </td>
    <td>
      <input type="checkbox" id="" name="muusik" value="muusik1" onchange="muusikuvalik()">
      <label for="muusik1">Male</label>
    </td>
    <td>
      <div id="vastus6"></div>
    </td>
  </tr>

</table>
</body>
</html>
