<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Saia kalkulaator</title>
    <script src="../js/saiakalkScript.js"></script>
    <script src="../js/tempKalk.js"></script>
    <script src="../js/valuutaScript.js"></script>
    <script src="../js/kutusekalk.js"></script>
    <link rel="stylesheet" href="kalkStyle.css">

</head>
<body>
<h1>Saia kalkulaatorid</h1>
<section id="yld">
<section id="osa1">
<h2>Saia kalkulaator</h2>
<label for="kogus">Kogus:</label>
<input type="number" id="kogus" min="1" max="10" step="1" onchange="saiaKalk()">
<br>
<label for="saiatyyp">Palun vali saia tüüp</label>
<select name="saiatyyp" id="saiatyyp" onchange="saiaKalk()">
    <option value="vali">vali..</option>
    <option value="mooni">moonisai</option>
    <option value="juustu">juustusai</option>
    <option value="pontsik">pontsik</option>
    <option value="kaneeli">kaneelisai</option>
</select>
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQDq_gC8V5DJDY2FvEk3Mg97fP8RUMbFzXX6faK_zNpBA&s=10" alt="" id="pilt" width="100" height="100">
<div id="vastus"></div>
</section>

<section id="osa2">
    <h2>Sisesta temperatuur</h2>
    <input type="number" id="temp" min="-50" max="50" step="1" value="0"> &deg;
    <br>

    <input type="radio" name="tempValik" id="celsius" value="celsius" onchange="tempTeisendus()">
    <label for="celsius"> &deg;C - celsius </label>
    <br>
    <input type="radio" name="tempValik" id="fahrenheit" value="fahrenheit" onchange="tempTeisendus()">
    <label for="fahrenheit">&deg;F - fahrenheit </label>
    <br>
    <div id="vastus2"></div>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrVAVd_HW_GMYNcL9w1rY52nJV4P3fnh_YGoqvo3_T2A&s=10" id="tempilt"></a>

</section>
    <section id="osa3">
        <h2>Valuuta kalkulaator</h2>
        <label for="euro">Sisesta summa eurodes</label>
        <input type="number" id="euro" min="1" max="10" step="1" onchange="valuutaKalkulaator()">
        <br>
        <label for="valuuta">Sisesta summa eurodes</label>
        <input type="text" id="valuuta" name="valuuta" onchange="valuutaKalkulaator()">
        <br>
        <div id="vastus3"></div>


    </section>
    <section id="osa4">
        <h2>Kütuse kalkulaator</h2>

        <label for="fuel">Sisesta kütus </label>
        <input type="number" id="fuel" min="1" max="50" step="1" onchange="hinnakalk()">
        <br>
        <br>
        <label for="pikkus">Sisesta teepikkus </label>
        <select name="pikkus" id="pikkus" onchange="hinnakalk()"></select>



        <div id="vastus4"></div>
    </section>
</section>

</body>
</html>
