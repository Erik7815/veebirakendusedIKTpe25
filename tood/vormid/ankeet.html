<!DOCTYPE html>
<html lang="et" >
<head>
    <meta charset="UTF-8">
    <title>vormid ja nupud</title>
    <script src="../js/ankeetScript.js"></script>
</head>
<body>
<h1>Sportlase ankeet</h1>
<form action="#">
    <table >
        <tr>
            <td>
                <label for="nimi">Sisesta oma nimi</label>
            </td>
            <td>
                <input type="text" id="nimi" oninput="nimiLugemine()">
            </td>
            <td>
                <div id="vastus"></div>
            </td>
        </tr>
        <tr>
            <td>
                <strong>Vali sugu</strong>
            </td>
            <td>
                <!--radio nupp - ainult üks valik on õige-->
                <input type="radio" name="sugu" id="naine" value="naine" onclick="suguValik()">
                <label for="naine">naine</label>
                <br>
                <input type="radio" name="sugu" id="mees" value="mees" onclick="suguValik()">
                <label for="mees">mees</label>
                <br>
                <input type="radio" name="sugu" id="muu" value="muu" onclick="suguValik()">
                <label for="muu">muu</label>
            </td>
            <td>
                <div id="vastus2"></div>
            </td>
        </tr>
        <tr>
            <td>
                <legend> <strong>Spordialad:</strong></legend>
            </td>
            <td>
                <!--checkbox - mitu valikut korraga-->
                <fieldset>

                    <input type="checkbox" name="spordiala" id="jooksmine" value="jooksmine" onchange="sportValik()">
                    <label for="jooksmine">jooksmine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="ujumine" value="ujumine" onchange="sportValik()">
                    <label for="ujumine">ujumine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="uisutamine" value="uisutamine" onchange="sportValik()">
                    <label for="uisutamine">uisutamine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="suusatamine" value="suusatamine" onchange="sportValik()">
                    <label for="suusatamine">suusatamine</label>
                    <br>
                    <input type="checkbox" name="spordiala" id="poks" value="poks" onchange="sportValik()">
                    <label for="poks">poks</label>
                </fieldset>
            </td>
            <td>
                <div id="vastus3"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="tund">Mitu tundi nädalas sina treenis?</label>
            </td>
            <td>
                <input type="number" min="0" max="24" step="1" value="6" id="tund">
            </td>
        </tr>
        <tr>
            <td>
                <!--rippmenüü -dropdown list-->
                <label for="klubi">Mis klubi sa külastad</label>
            </td>
            <td>
                <select name="klubi" id="klubi" onchange="klubiValik()">
                    <option value="vali">vali</option>
                    <option value="myfitness">MyFitness</option>
                    <option value="gym24">GYM24</option>
                    <option value="gym">GYM</option>
                    <option value="kalevspa">KalevSPA</option>
                </select>
            </td>
            <td>
                <div id="vastus5"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="varv"> Mis värvi tossud on sul?</label>
            </td>
            <td>
                <input type="color" id="varv">
            </td>
        </tr>
        <tr>
            <td>
                <label for="kuupaev">Millal oli su viimane trenn?</label>
            </td>
            <td>
                <input type="date" id="kuupaev" min="2026-01-01" max="2026-12-31" onchange="kuupaevValik()">
            </td>
            <td>
                <div id="vastus6"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="kogemus">Millal oli su viimane trenn?</label>
            </td>
            <td>
                <input type="range" id="kogemus" min="2026-01-01" max="2026-12-31" onchange="kuupaevValik()">
            </td>
            <td>
                <div id="vastus7"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label  for="parool">Sisesta oma parool</label>
            </td>
            <td>
                <input type="password" id="parool" name="parool">
            </td>
        </tr>
        <tr>
            <td>
                <label for="fail">Näita tulemusi</label>
            </td>
            <td>
                <input type="file" id="fail" name="fail">
            </td>
        </tr>
        <tr>
            <td>
                <label for="phone">Sisesta oma telefoni number</label>
            </td>
            <td>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}">
            </td>
        </tr>
        <tr>
            <td>
                <label for="email">Sisesta e-mail</label>
            </td>
            <td>
                <input type="email" id="email" name="email">
            </td>
        </tr>
        <tr>
            <td>
                <input type="reset" value="Puhasta">
            </td>
            <td>
                <input type="button" value="Näita andmed" onclick="tervitus()">
            </td>
            <td>
                <div id="vastus4"></div>
            </td>
        </tr>
    </table>

</form>

</body>
</html>
